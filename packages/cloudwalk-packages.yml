generated: '2026-08-01'
method: searched
source: >-
  npm, PyPI, RubyGems, Packagist, crates.io and pkg.go.dev registry searches for
  "cloudwalk", "infinitepay" and "infinitetap", plus the InfinitePay developer pages
  (https://www.infinitepay.io/desenvolvedores) and the CloudWalk GitHub organization
  (https://github.com/cloudwalk).
description: >-
  CloudWalk ships no general-purpose server-side SDK for the Integrated Checkout API — the
  published reference is a two-endpoint JSON contract with curl-level examples and no client
  library. What CloudWalk does publish is first-party POS runtime libraries on RubyGems (for
  its own mruby/DaFunk card-terminal runtime) and an InfinitePay WooCommerce payment plugin
  on Packagist, plus its BRLC smart-contract library on npm. Community-maintained client
  libraries for the checkout API exist (a JS SDK and a PHP SDK) and are recorded here as
  unofficial so integrators can find them without them being mistaken for first-party.
packages:
- language: ruby
  registry: rubygems
  name: infinite_pay
  url: https://rubygems.org/gems/infinite_pay
  install: gem install infinite_pay
  version: 1.0.0
  downloads: 2460
  official: true
  official_evidence: >-
    homepage http://cloudwalk.io; the library starts InfinitePay transactions inside
    CloudWalk's own DaFunk POS runtime. Published under an individual maintainer account
    (scalone) rather than a CloudWalk org account.
  description: InfinitePay payment library to start transactions in the DaFunk runtime.
- language: ruby

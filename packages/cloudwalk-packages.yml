  official: true
  official_evidence: >-
    published under the `cloudwalk` Packagist vendor namespace; source repository declared as
    https://github.com/cloudwalk/infinitepay-woocommerce-plugin.
  description: >-
    Official InfinitePay payment method plugin for WooCommerce. NOTE — the declared GitHub
    source repository returned 404 when probed on 2026-08-01 (repo is private or removed);
    only dev- branches are tagged on Packagist and total downloads are in single digits, so
    treat this as low-maintenance/legacy.
- language: javascript
  registry: npm
  name: "@cloudwalkinc/brlc-contracts"
  url: https://www.npmjs.com/package/@cloudwalkinc/brlc-contracts

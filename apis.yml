aid: cloudwalk
name: CloudWalk
description: >-
  CloudWalk, Inc. is a Sunnyvale- and São Paulo-based payments and financial-infrastructure
  company that builds an AI-native transaction layer for small businesses. It operates three
  consumer-facing brands: InfinitePay, its Brazilian acquirer and digital-banking platform
  (card machines, Tap to Pay, hosted checkout, payment links, Pix, PJ accounts, credit and
  CDB); JIM, a phone-as-POS operating system for self-employed workers in the United States;
  and Pierre, a personal-finance intelligence product built on Brazilian Open Finance. Its
  public developer surface is deliberately small and integration-shaped rather than
  platform-shaped: an Integrated Checkout REST API on api.checkout.infinitepay.io that
  creates hosted payment links and checks their status, an approved-payment webhook, and an
  InfiniteTap deeplink contract that hands a Tap-to-Pay transaction from a third-party POS
  app to the InfinitePay mobile app and back. CloudWalk publishes no OpenAPI, no
  machine-readable discovery documents and no MCP or agent surface. The legal entity behind
  InfinitePay is CLOUDWALK INSTITUIÇÃO DE PAGAMENTO E SERVIÇOS LTDA (CNPJ 18.189.547/0001-42),
  a Brazilian payment institution supervised by the Banco Central do Brasil.

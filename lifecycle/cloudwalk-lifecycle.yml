  scheme: none
  current: null
  docs: null
  detail: >-
    The Checkout API carries no version in the path, no version header, and no dated version
    pinning. The only versioned CloudWalk path observed anywhere is /v2/cards/tokenize on
    authorizer.infinitepay.io, which has no live public documentation.
deprecation:
  policy_url: null

  note: >-
    The current published reference names only the api.checkout host. The legacy path was
    probed and still returns the identical validation error, so it has not been retired — but
    because no deprecation policy exists, integrators have no notice mechanism if it is.
    Third-party integrators have described the api.checkout host as the "new official
    infrastructure" adopted mid-2026; CloudWalk itself has published no such statement, so
    that timing is recorded as unconfirmed.

  sunset_header: false
  detail: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation header support observed, and no
    advance-notice commitment. No deprecated operations exist in the captured OpenAPI.
host_migration:
  observed: true
  from: https://api.infinitepay.io/invoices/public/checkout

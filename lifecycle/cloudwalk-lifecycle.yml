description: >-
  Lifecycle posture for CloudWalk's public InfinitePay integration surface. CloudWalk runs a
  public status page but publishes no API versioning policy, no deprecation policy, no
  changelog and no SLA. The one observable lifecycle event is a host migration: the checkout
  operations moved from a path on api.infinitepay.io to a dedicated
  api.checkout.infinitepay.io host, with the old path still answering.
